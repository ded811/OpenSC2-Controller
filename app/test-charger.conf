# THE CHARGER TEST BUILD: a temporary testing aid, NOT the real controller's behaviour, and NOT in
# the default build or any release. On a plain USB wall charger it worked with the 2026-10-19
# development snapshot; it has not been tried again with this release. Build it only on
# purpose, on top of prj.conf, from the repository folder (README.md, "Test build"):
#
#   powershell -NoProfile -ExecutionPolicy Bypass -File build.ps1 -Project app\test-charger.conf -OutDir C:\b\osc2-chg -Pristine
#   west build -p always -d build-charger -b promicro_nrf52840/nrf52840/uf2 app -- -DEXTRA_CONF_FILE=test-charger.conf
#
# Always in a build folder of its own: a folder's CMake cache keeps this fragment. build.ps1 sees
# that and starts the folder over; plain west does not, and keeps building the fragment in. With
# west, build the default firmware in another folder (west's default, build) or with -p always.
#
# Why: booted on USB power the board comes up wired and, like the real controller, waits for a PC
# to set it up; the real controller leaves that wait when STEAM is pressed. On a plain USB wall
# charger no PC ever comes, and a board with no buttons wired has no STEAM to press, so it never
# connects to the puck. With this fragment, a wired boot (USB power, the boot rule) that no host
# has sent a single USB request to within 5 s reboots into wireless mode and connects through the
# puck while it charges. A PC that is on sends its first request within a second, so on a PC the
# board stays wired as before; a PC that is asleep, or booting without touching USB, looks like a
# charger and gets a wireless board too (replug it once the PC is up).
#
# The board says so: "opensc2 status" shows a "test aid:" line, the USB session log notes it at
# every wired boot and when it falls back, and the hardware test suite warns in hooks.present.
# Flash the default build again when you are done testing (build.ps1 -Project app; with west, a
# folder never built with this fragment, or one built again with -p always).
CONFIG_OPENSC2_NO_HOST_WIRELESS_MS=5000
