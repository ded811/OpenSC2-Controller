# THE WATCHDOG TEST BUILD: the blank canvas with the hardware watchdog of the real controller
# (CONFIG_OPENSC2_WATCHDOG, docs/api.md, "Reliability"). Not in the default build yet: it has not
# been tried on hardware, and above all not with the Adafruit UF2 bootloader. Build it on purpose,
# on top of prj.conf, from the repository folder, in a build folder of its own:
#
#   powershell -NoProfile -ExecutionPolicy Bypass -File build.ps1 -Project app\watchdog.conf -OutDir C:\b\osc2-wdt -Pristine
#
# What to check before relying on it: that "uf2" in the shell (or a double tap of reset) still
# opens the UF2 drive and that a .uf2 copy completes. The nRF52's watchdog cannot be stopped and
# may keep running through a soft reset; if the bootloader does not feed it, the bootloader resets
# 5 s after it starts. A power cycle always stops the watchdog: to flash the default build again,
# unplug the board, plug it back in and short RST to GND twice at once, so the bootloader opens
# its drive before this firmware starts the watchdog again.
CONFIG_OPENSC2_WATCHDOG=y
