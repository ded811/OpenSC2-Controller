#
# The hardware watchdog of the real controller (CONFIG_OPENSC2_WATCHDOG, docs/api.md, "The hardware
# watchdog"). The library turns it on by default, but not in a build for a UF2 bootloader such as
# this board's: whether the bootloader feeds a watchdog left running has not been tried. This
# fragment turns it on (all.conf names it). It has not been tried on hardware with this firmware. If a .uf2 copy is ever
# cut short: a power cycle stops the watchdog; unplug the board, plug it back in and right away
# short RST to GND twice quickly, so the bootloader opens its drive before this firmware starts
# the watchdog again.
CONFIG_OPENSC2_WATCHDOG=y
