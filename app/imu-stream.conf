#
# A build of the blank canvas with the real controller's IMU read the way it reads it (app/README.md):
#   build.ps1 -Project app\imu-stream.conf
# with imu-stream.overlay, which app/CMakeLists.txt adds with it: an LSM6DSV16X whose FIFO is
# streamed with its own sensor fusion (the game rotation vector and the gyro bias). Untested on
# hardware.
CONFIG_SENSOR_ASYNC_API=y
CONFIG_I2C_RTIO=y
CONFIG_LSM6DSV16X_TRIGGER_GLOBAL_THREAD=y
CONFIG_APP_IMU_STREAM=y
# Zephyr 4.4 marks I2C_RTIO experimental (the streaming API needs it on I2C): known, so its build
# warning is turned off here.
CONFIG_WARN_EXPERIMENTAL=n
