#
# A BATTERY BUILD of the blank canvas, on top of prj.conf: for a SuperMini with a LiPo on its
# battery pads. NOT tested on hardware yet. Build it on purpose, in a build folder of its own
# (README.md, "Build options"):
#
#   powershell -NoProfile -ExecutionPolicy Bypass -File build.ps1 -Project app\battery.conf -OutDir C:\b\osc2-bat -Pristine
#   west build -p always -d build-battery -b promicro_nrf52840/nrf52840/uf2 app -- -DEXTRA_CONF_FILE=battery.conf
#
# What changes (docs/api.md, "Power and the system state machine"): without USB power the board runs
# on its battery, as the real controller does. STEAM held 7 s, Steam's "turn off", the idle timeout
# (controller setting 50, 15 minutes by default), a puck that is gone (60 s of listening, 10 s with
# an empty bond slot), 0 % battery, and the cable pulled while wired turn the board off (System
# OFF). STEAM wakes it (the pin of the gpio-keys key with OPENSC2_KEY_STEAM; without one, any key),
# and so does plugging in USB. On USB power nothing changes.
#
# This board measures no battery voltage: the level stays 100 % unless an application sets one, so
# low battery never turns it off. A charger with a status output can give the charge state
# (charger-status-gpios in the overlay). Without a STEAM button wired, only a USB cable or a reset
# brings a board back that has turned itself off.
CONFIG_OPENSC2_BATTERY=y
