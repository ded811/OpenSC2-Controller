#
# THE DOCK BUILD: BUILT, NEVER RUN ON HARDWARE, and not the default firmware. The SuperMini as a
# controller that can rest on Valve's puck: the dock's UART and pilot sense (CONFIG_OPENSC2_DOCK)
# on four pins that are buttons in the default build (dock.overlay, which app/CMakeLists.txt adds
# with this fragment, says which). Build it on purpose, in a build folder of its own:
#
#   powershell -NoProfile -ExecutionPolicy Bypass -File build.ps1 -Project app\dock.conf -OutDir C:\b\osc2-dock -Pristine
#
# NOTHING MAY BE CONNECTED TO VALVE'S PUCK'S PADS without the owner's step-by-step go-ahead: the
# pads' voltages and loads have not been measured, and the puck's + pad carries about 5 V once the
# puck switches it on (docs/testing.md, The dock). Try the build against a USB-UART adapter acting
# as the puck first (tools/fake_puck.py).
#
# The dock link itself (the frames, the requests, the test hooks' dock ops) is in the default
# build too, without pins.
CONFIG_OPENSC2_DOCK=y

# The dock's UART (UARTE1) on the async API; the debug console stays on USB.
CONFIG_SERIAL=y
CONFIG_UART_ASYNC_API=y
CONFIG_UART_1_INTERRUPT_DRIVEN=n
CONFIG_UART_1_ASYNC=y
