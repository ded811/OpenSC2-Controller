#
# EVERYTHING THAT NEEDS NO PARTS: a test build of the blank canvas with Bluetooth LE, the haptics
# synthesiser, the dock link and the hardware watchdog together, on top of prj.conf. Built; NOT YET
# TESTED ON HARDWARE, and neither the default firmware nor part of any release. Build it on
# purpose, in a build folder of its own:
#
#   powershell -NoProfile -ExecutionPolicy Bypass -File build.ps1 -Project app\all.conf -OutDir C:\b\osc2-all -Pristine
#   west build -p always -d build-all -b promicro_nrf52840/nrf52840/uf2 app -- -DEXTRA_CONF_FILE=all.conf
#
# It builds on three fragments of this folder, which app/CMakeLists.txt adds before this one (the
# OPENSC2_FRAGMENTS line below names them); read their notes first: ble.conf (the board still boots
# on the puck until Bluetooth is chosen), haptics.conf, and watchdog.conf (the watchdog cannot be
# stopped, and has not been tried with the UF2 bootloader: how to flash the board again is there).
# OPENSC2_FRAGMENTS: ble.conf haptics.conf watchdog.conf
#
# Left out because they need parts: sensors.conf, imu-stream.conf and expander.conf (sensors and a
# port expander on pins of their own), battery.conf (a battery: without one a shutdown that powers
# off could not be woken), and dock.conf (the dock's UART and pilot sense take four button pins and
# need a front end). test-charger.conf is a test aid of its own. All four features fit together:
# about 380 KB of flash and 94 KB of RAM.

# The dock link: the protocol without pins, which the test hooks feed (on with them by default;
# named here so that it stays on).
CONFIG_OPENSC2_DOCK_LINK=y
