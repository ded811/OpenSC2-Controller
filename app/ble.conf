# THE BLUETOOTH BUILD: opt-in, built but NOT YET TESTED ON HARDWARE, and not in the default build
# or any release. Bluetooth LE as a third wireless transport next to the puck: the board as a
# HID-over-GATT Steam Controller 2 (PnP ID 28DE:1303). Build it on top of prj.conf, in a build
# folder of its own (README.md, "Test builds"):
#
#   powershell -NoProfile -ExecutionPolicy Bypass -File build.ps1 -Project app\ble.conf -OutDir C:\b\osc2-ble -Pristine
#   west build -p always -d build-ble -b promicro_nrf52840/nrf52840/uf2 app -- -DEXTRA_CONF_FILE=ble.conf
#
# The board still boots wired on USB power and wireless on the stored transport, the puck by
# default. On its console: "opensc2 transport ble" switches to Bluetooth (and it is stored once a
# host has connected and encrypted the link), "opensc2 ble status" shows the link, "opensc2 ble
# pair" opens the slot for a new host. "opensc2 transport puck" goes back. Every option:
# docs/api.md, Bluetooth LE.

# ---- the library ----------------------------------------------------------------------------
CONFIG_OPENSC2_BLE=y

# ---- the stack: Nordic's SoftDevice Controller (peripheral only) and Zephyr's host -------------
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_MAX_CONN=1
# +6 dBm, as the real controller (and the puck's link) use.
CONFIG_BT_CTLR_TX_PWR_PLUS_6=y

# Just Works pairing with LE Secure Connections only (no legacy pairing), bonding, keys of 16
# bytes. No input or output: no passkey, no confirmation.
CONFIG_BT_SMP=y
CONFIG_BT_SMP_SC_PAIR_ONLY=y
CONFIG_BT_BONDABLE=y
# Five identities (0 is never used to advertise; 1 and 2 are slot 1, 3 and 4 slot 2) and room for
# five bonds; bonds and identities stored with the settings.
CONFIG_BT_SETTINGS=y
CONFIG_BT_ID_MAX=5
CONFIG_BT_MAX_PAIRED=5
CONFIG_BT_FILTER_ACCEPT_LIST=y
# A host that bonds again on another identity loses its older bond; an unauthenticated pairing may
# replace keys held on another identity, never those of the identity in use (a host that pairs
# again on the identity it is bonded to is refused: pairing mode, `opensc2 ble pair`, gives it a
# fresh identity).
CONFIG_BT_ID_UNPAIR_MATCHING_BONDS=y
CONFIG_BT_ID_ALLOW_UNAUTH_OVERWRITE=y

# The name ("Steam Ctrl (BT) " and the unit serial: 29 characters), set at every boot; the
# appearance: gamepad (0x03C4).
CONFIG_BT_DEVICE_NAME_DYNAMIC=y
CONFIG_BT_DEVICE_NAME_MAX=31
CONFIG_BT_DEVICE_NAME="Steam Ctrl (BT)"
CONFIG_BT_DEVICE_APPEARANCE=964

# Buffers for 67-byte ATT packets: L2CAP packets of up to 71 bytes, an ATT MTU of 67 offered, and
# four prepare-write buffers so a host at the default MTU can still write the 64-byte feature
# report. The controller never starts a data-length update itself (a host may).
CONFIG_BT_BUF_ACL_RX_SIZE=71
CONFIG_BT_BUF_ACL_TX_SIZE=71
CONFIG_BT_L2CAP_TX_MTU=67
CONFIG_BT_ATT_PREPARE_COUNT=4
CONFIG_BT_AUTO_DATA_LEN_UPDATE=n
CONFIG_BT_BUF_ACL_TX_COUNT=8
CONFIG_BT_L2CAP_TX_BUF_COUNT=8
CONFIG_BT_ATT_TX_COUNT=10

# Connection parameters: 7.5 ms, latency 0, 420 ms supervision timeout, asked for 5 s after the
# connection starts; the 2M PHY asked for at once. The host's version and features are not read.
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=6
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=42
CONFIG_BT_GAP_AUTO_UPDATE_CONN_PARAMS=y
CONFIG_BT_AUTO_PHY_PERIPHERAL_2M=y
CONFIG_BT_REMOTE_INFO=n

# The Battery Service (Zephyr's); the Device Information Service and the HID service are the
# library's own.
CONFIG_BT_BAS=y

# Vendor commands run in the host's receive thread when a host writes feature report 1, and some
# write flash (0xEF, the bond).
CONFIG_BT_RX_STACK_SIZE=3072
