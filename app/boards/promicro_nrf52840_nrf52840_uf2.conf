# Kconfig for this one board target, promicro_nrf52840/nrf52840/uf2: Zephyr adds this file after
# prj.conf when it builds for that target. Another board gets a file of its own, named after its
# board target (docs/porting.md).

# SuperMini / Pro Micro nRF52840: no 32.768 kHz crystal, so the internal RC oscillator, calibrated.
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC_CALIBRATION=y
