# A build of the blank canvas with every button of the real controller (app/README.md):
#   build.ps1 -Project app\expander.conf
# with expander.overlay, which app/CMakeLists.txt adds with it: an I2C port expander (an NXP
# PCA9555) carries the four grip buttons and the two D-pad buttons whose pins the bus takes, read
# in polling mode every 16 ms. Untested on hardware.

# The bus is freed at boot, as the real controller does, before the expander's driver starts
# (the recovery runs at priority 60, the expander after it).
CONFIG_APP_I2C_RECOVER=y
CONFIG_GPIO_PCA95XX_INIT_PRIORITY=70
