# OpenSC2 blank canvas: a Steam Controller 2 for the official puck.
# Pins are in boards/promicro_nrf52840_nrf52840_uf2.overlay.

# ---- the library ------------------------------------------------------------------------------
CONFIG_OPENSC2=y
# The puck sends packets of up to 128 bytes; the real controller keeps two replies queued.
CONFIG_ESB_MAX_PAYLOAD_LENGTH=128
CONFIG_ESB_TX_FIFO_SIZE=2
CONFIG_ESB_RX_FIFO_SIZE=8

# Identity reported to Steam. The defaults are development values: "OSC"/"OSB" serials made from
# the chip's ID (CONFIG_OPENSC2_SERIAL_FROM_CHIP), not a real controller's. Uncomment to choose
# your own (13 characters, 0-9 and A-Z), or set them on the board: `opensc2 id set unit ...`.
#CONFIG_OPENSC2_SERIAL_FROM_CHIP=n
#CONFIG_OPENSC2_UNIT_SERIAL="OSC2DEV000001"
#CONFIG_OPENSC2_BOARD_SERIAL="OSC2PCB000001"
CONFIG_OPENSC2_GIT_REVISION="osc2-app-0.1"

# ---- inputs and outputs -----------------------------------------------------------------------
CONFIG_GPIO=y
CONFIG_INPUT=y
CONFIG_ADC=y
# PWM (rumble motor, RGB LED) is switched on by the overlay: enable a PWM instance there.

# ---- bonds and the stored identity: Zephyr settings on NVS, in the board's storage partition ----
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y

# ---- system -------------------------------------------------------------------------------------
# The SuperMini has no 32.768 kHz crystal: use the internal RC oscillator, calibrated.
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC_CALIBRATION=y
CONFIG_REBOOT=y
CONFIG_MAIN_STACK_SIZE=2048

# Log and shell ("opensc2 status", "opensc2 pair", "uf2", ...) on the board's USB serial port.
CONFIG_LOG=y
CONFIG_SHELL=y
CONFIG_LOG_BACKEND_UART=n
CONFIG_SHELL_PROMPT_UART="opensc2:~$ "
