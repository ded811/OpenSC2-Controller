#
# OpenSC2 blank canvas: a Steam Controller 2 for Valve's puck, wired or wireless (README.md).
# Pins are in boards/promicro_nrf52840_nrf52840_uf2.overlay; the SuperMini's own Kconfig lines (its
# clock) are in boards/promicro_nrf52840_nrf52840_uf2.conf. Every option: docs/api.md.

# ---- the library ------------------------------------------------------------------------------
CONFIG_OPENSC2=y
# The puck sends packets of up to 128 bytes; the real controller keeps two replies queued.
CONFIG_ESB_MAX_PAYLOAD_LENGTH=128
CONFIG_ESB_TX_FIFO_SIZE=2
CONFIG_ESB_RX_FIFO_SIZE=8

# Identity reported to Steam. The defaults are development values: "OSC"/"OSB" serials made from
# the chip's ID (CONFIG_OPENSC2_SERIAL_FROM_CHIP), not a real controller's. Uncomment to choose
# your own (13 characters, 0-9 and A-Z; keep the OSC prefix, the hardware test suite only talks
# to boards whose serial starts with OSC), or set them on the board:
# `opensc2 id set unit OSC2MYBOARD01`.
#CONFIG_OPENSC2_SERIAL_FROM_CHIP=n
#CONFIG_OPENSC2_UNIT_SERIAL="OSC2DEV000001"
#CONFIG_OPENSC2_BOARD_SERIAL="OSC2PCB000001"
# The firmware revision Steam reads (1 to 12 characters): this release.
CONFIG_OPENSC2_GIT_REVISION="osc2-0.2.0"

# Hardware test hooks for tools/hwtest, on so that the suite tests this very image. Inert until
# the suite arms them (a keyed vendor command 0x7E over USB or through the puck, or
# "opensc2 test" on the console; RAM only, gone at every reboot but for a boot-time injection
# stored for the next boot, and the lease ends it when the PC goes quiet): unarmed the board
# answers exactly as without them. The key is published with
# the code, so it stops accidents, not a program that wants to send controller input (a local
# program can create desktop input anyway); mouse and keyboard reports never leave the board
# while armed. About 3 KB of RAM. For a board you give to someone else, set it to n.
CONFIG_OPENSC2_TEST_HOOKS=y

# ---- wired mode: the board as a USB Steam Controller 2 (28DE:1302) ------------------------------
# On by default (the overlay chooses its HID node). At a boot with USB power the board comes up
# wired, as the real controller does; hold the pairing button while plugging in for wireless.
# The library runs the USB device itself, so the board's own serial port is off; in wireless
# mode the library shows the same console (CONFIG_OPENSC2_USB_CONSOLE).
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=n
# Eight input reports may wait for the host at once; nothing ever blocks on it.
CONFIG_USBD_HID_IN_BUF_COUNT=8
# Vendor commands that write flash (Steam's bond) run in the USB stack's thread.
CONFIG_USBD_THREAD_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
# The USB identity form (October 2026 by default, the current controller firmware's; July's is the
# one Steam was seen pairing with OpenSC2 0.2.0):
#CONFIG_OPENSC2_USB_PROFILE_JULY=y
# Never wired, until changed with `opensc2 mode auto`:
#CONFIG_OPENSC2_DEFAULT_POLICY_WIRELESS=y
# No USB console in wireless mode, like the real controller:
#CONFIG_OPENSC2_USB_CONSOLE=n
# Wired with no PC (a USB charger), this build waits, as the real controller does, until a PC sets
# it up or STEAM is pressed. test-charger.conf is a separate TEST build for a board without
# buttons (wireless after 5 s without a host); it is not part of this default build.

# ---- inputs and outputs -----------------------------------------------------------------------
CONFIG_GPIO=y
CONFIG_INPUT=y
CONFIG_ADC=y
# PWM (rumble motor, RGB LED) is switched on by the overlay: enable a PWM instance there.

# ---- bonds and the stored identity: Zephyr settings on NVS, in the board's storage partition ----
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y

# ---- system -------------------------------------------------------------------------------------
CONFIG_REBOOT=y
CONFIG_MAIN_STACK_SIZE=2048

# Log and shell ("opensc2 status", "opensc2 usb log", "uf2", ...) on the USB serial port in
# wireless mode. While wired the log goes into the USB session log instead.
CONFIG_LOG=y
CONFIG_SHELL=y
CONFIG_LOG_BACKEND_UART=n
# The log thread also writes the log into the session log while wired: more stack than 768 bytes.
CONFIG_LOG_PROCESS_THREAD_STACK_SIZE=1536
CONFIG_SHELL_PROMPT_UART="opensc2:~$ "

# ---- Bluetooth LE, the haptics synthesiser and pad clicks by pressure: in the default build -----
# Like the real controller, the board talks to the PC through Bluetooth OR the puck, one at a time
# (the stored transport; chords and `opensc2 transport` switch). The settings below are
# ble.conf's (its notes explain each one) and haptics.conf's.
CONFIG_OPENSC2_BLE=y
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_MAX_CONN=1
CONFIG_BT_CTLR_TX_PWR_PLUS_6=y
CONFIG_BT_SMP=y
CONFIG_BT_SMP_SC_PAIR_ONLY=y
CONFIG_BT_BONDABLE=y
CONFIG_BT_SETTINGS=y
CONFIG_BT_ID_MAX=5
CONFIG_BT_MAX_PAIRED=5
CONFIG_BT_FILTER_ACCEPT_LIST=y
CONFIG_BT_ID_UNPAIR_MATCHING_BONDS=y
CONFIG_BT_ID_ALLOW_UNAUTH_OVERWRITE=y
CONFIG_BT_DEVICE_NAME_DYNAMIC=y
CONFIG_BT_DEVICE_NAME_MAX=31
CONFIG_BT_DEVICE_NAME="Steam Ctrl (BT)"
CONFIG_BT_DEVICE_APPEARANCE=964
CONFIG_BT_BUF_ACL_RX_SIZE=71
CONFIG_BT_BUF_ACL_TX_SIZE=71
CONFIG_BT_L2CAP_TX_MTU=67
CONFIG_BT_ATT_PREPARE_COUNT=4
CONFIG_BT_AUTO_DATA_LEN_UPDATE=n
CONFIG_BT_BUF_ACL_TX_COUNT=8
CONFIG_BT_L2CAP_TX_BUF_COUNT=8
CONFIG_BT_ATT_TX_COUNT=10
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=6
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=42
CONFIG_BT_GAP_AUTO_UPDATE_CONN_PARAMS=y
CONFIG_BT_AUTO_PHY_PERIPHERAL_2M=y
CONFIG_BT_REMOTE_INFO=n
CONFIG_BT_BAS=y
CONFIG_BT_RX_STACK_SIZE=3072
CONFIG_OPENSC2_HAPTICS_SYNTH=y
# The pads click from their pressure (settings 52 and 53), as the real ones do.
CONFIG_OPENSC2_PAD_CLICK_AUTO=y
