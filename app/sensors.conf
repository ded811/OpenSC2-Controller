# A build of the blank canvas closer to the real controller's input path (app/README.md):
#   build.ps1 -Project app\sensors.conf
# Every option here is untested on hardware.

# Sticks and triggers read right before each state report, four conversions averaged, with the
# sensors' supply on only while they are read (zephyr,user sensor-supply-gpios, if wired).
CONFIG_APP_ANALOG_SAMPLE=y
# A calibrated stick or trigger goes through the library's stored calibration (record one with
# "opensc2 cal sticks 1", "2", "3" on the console, the sticks connected and a link up).
CONFIG_APP_ANALOG_RAW=y
# The battery level from VDDH / 5 (or a "battery" io-channel in zephyr,user).
CONFIG_APP_BATTERY=y
