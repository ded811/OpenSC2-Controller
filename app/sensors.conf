# A build of the blank canvas closer to the real controller's input path (app/README.md):
#   build.ps1 -Project app\sensors.conf
# with sensors.overlay, which app/CMakeLists.txt adds with it. Every option here is untested on
# hardware.

# Sticks and triggers read right before each state report, four conversions averaged, with the
# sensors' supply on only while they are read (zephyr,user sensor-supply-gpios, if wired).
CONFIG_APP_ANALOG_SAMPLE=y
# A calibrated stick or trigger goes through the library's stored calibration (record one with
# "opensc2 cal sticks 1", "2", "3" on the console, the sticks connected and a link up).
CONFIG_APP_ANALOG_RAW=y
# The battery level from VDDH / 5 (or a "battery" io-channel in zephyr,user).
CONFIG_APP_BATTERY=y
# sensors.overlay adds the real controller's IMU, an LSM6DSV16X, on I2C (instead of two D-pad
# buttons), with its mounting matrix; the gyro's bias estimated at rest (settings 84 and 85), and
# the bus freed at boot.
CONFIG_APP_IMU_BIAS=y
CONFIG_APP_I2C_RECOVER=y
# sensors.overlay also adds a Cirque Pinnacle as the right trackpad (instead of the left bumper),
# processed as the real controller processes its pads, and a CAP1206 capacitive sensor for the
# stick-touch and grip bits (its driver comes with the devicetree node).
CONFIG_APP_PAD_PROCESSING=y
