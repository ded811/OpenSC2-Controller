# THE HAPTICS BUILD: the blank canvas with the haptics synthesiser on (CONFIG_OPENSC2_HAPTICS_SYNTH),
# a Kconfig fragment on top of prj.conf. The synthesiser is on by default now (in the library and
# in prj.conf), so this fragment only keeps older build commands working: it builds the same
# firmware as prj.conf alone. On the v0.2.0 release image the hardware test suite checks, with
# nothing wired, how the synthesiser handles the haptic reports (below); its sound has never been
# heard, as no actuator has been on a test board. From the repository folder:
#
#   powershell -NoProfile -ExecutionPolicy Bypass -File build.ps1 -Project app\haptics.conf -OutDir C:\b\osc2-hap -Pristine
#   west build -p always -d build-haptics -b promicro_nrf52840/nrf52840/uf2 app -- -DEXTRA_CONF_FILE=haptics.conf
#
# Always in a build folder of its own (a folder's CMake cache keeps the fragment).
#
# What it adds: the library renders every haptic output report (rumble, pulses, clicks, tones,
# sweeps, scripts, PCM streams) into sample blocks for the pads (4 kHz) and the grips (8 kHz),
# plays OpenSC2's own built-in sounds and sends the streams' flow control (input report 0x44).
# With nothing wired the blocks go nowhere, paced by a timer, and the hardware test suite checks
# them through the test hooks (run on the release image) (tools/hwtest, group "haptics": CRCs of rendered blocks, generator
# starts and stops, the stream flags). With a vibration motor on the overlay's "rumble" PWM
# channel (samples/rumble's wiring), the motor follows the rendered blocks' loudness instead of the
# decoded reports. Real actuator outputs (an I2S amplifier, the pads' PWM DAC, a DRV2605):
# samples/haptics.
CONFIG_OPENSC2_HAPTICS_SYNTH=y
