# SPDX-License-Identifier: MIT
# What GitHub's Linux runners can check without the nRF Connect SDK: tests/host/run.sh (the C host
# tests with gcc, the hardware test suite's self-tests, its dry run against the firmware emulator,
# and the self-tests of tools/match_steam_version.py) and the links in the documentation. Firmware
# builds need the SDK and are checked locally (docs/releasing.md).
name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  host-tests:
    name: Host tests and test-suite self-tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
      - name: tests/host/run.sh
        run: sh tests/host/run.sh
  links:
    name: Links in the documentation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
      - name: Relative links and anchors
        run: python3 -I tools/check_links.py
