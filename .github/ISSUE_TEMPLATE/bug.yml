# SPDX-License-Identifier: MIT
name: Bug report
description: Something does not work the way the documentation says.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Mask serials before you post.** `opensc2 bonds` shows your puck's serial, and
        `opensc2 status` and `opensc2 id` show the board's serials: mask them before you post them.
        `opensc2 usb log` and the test suite's reports are masked and safe to share.

        Before you file: [troubleshooting](https://github.com/ded811/OpenSC2-Controller/blob/main/docs/troubleshooting.md).
  - type: input
    id: board
    attributes:
      label: Board
      description: The board, and anything wired to it.
      placeholder: SuperMini nRF52840, nothing wired
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: OpenSC2 version or commit
      description: A release tag, or the output of `git rev-parse --short HEAD`.
      placeholder: v0.2.0
    validations:
      required: true
  - type: input
    id: sdk
    attributes:
      label: nRF Connect SDK version
      placeholder: v3.4.0
  - type: input
    id: build
    attributes:
      label: Build command or release asset
      placeholder: build.ps1 -Project app -OutDir C:\b\osc2 -Pristine
  - type: input
    id: steam
    attributes:
      label: Steam client version
      description: The Steam client's version or date, if you know it.
  - type: input
    id: puck
    attributes:
      label: Puck firmware
      description: October 2026, or another version if you know it.
      placeholder: October 2026
  - type: input
    id: os
    attributes:
      label: PC operating system
      placeholder: Windows 11
  - type: dropdown
    id: mode
    attributes:
      label: Wired or wireless
      options:
        - Wired (on the USB cable)
        - Wireless (through the puck)
        - Both
        - Not sure
  - type: textarea
    id: steps
    attributes:
      label: Steps
      description: What you did, step by step.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead
    validations:
      required: true
  - type: textarea
    id: status
    attributes:
      label: Output of `opensc2 status`, serials masked
      description: In wireless mode, on the board's console.
      render: text
  - type: textarea
    id: report
    attributes:
      label: The test suite's report.md, if you ran it
      description: It is masked already.
