# An RGB LED that follows Steam's LED colour and shows the link.
CONFIG_OPENSC2=y
CONFIG_ESB_MAX_PAYLOAD_LENGTH=128
CONFIG_ESB_TX_FIFO_SIZE=2

CONFIG_GPIO=y
CONFIG_INPUT=y
CONFIG_PWM=y

CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y

CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC_CALIBRATION=y
CONFIG_LOG=y

# The LED loop in main() runs below the radio thread (priority 5).
CONFIG_MAIN_THREAD_PRIORITY=7
