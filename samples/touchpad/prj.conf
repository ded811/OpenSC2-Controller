# A Cirque Pinnacle trackpad module as the right trackpad, wired or wireless.
# The SuperMini's own lines (its clock) are in boards/promicro_nrf52840_nrf52840_uf2.conf.

# The library. The puck sends packets of up to 128 bytes; the real controller keeps two replies
# queued.
CONFIG_OPENSC2=y
CONFIG_ESB_MAX_PAYLOAD_LENGTH=128
CONFIG_ESB_TX_FIFO_SIZE=2

# The touch module on I2C (Zephyr's cirque,pinnacle input driver) and the buttons (gpio-keys).
CONFIG_GPIO=y
CONFIG_I2C=y
CONFIG_INPUT=y

# Wired mode (the overlay chooses the HID node). The library runs the USB device, so the board's
# own serial port does not start at boot; in wireless mode the library shows it as the console.
# Eight report buffers, and room on the stacks for the vendor commands that write flash.
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=n
CONFIG_USBD_HID_IN_BUF_COUNT=8
CONFIG_USBD_THREAD_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# Bonds survive a reboot in Zephyr settings, on NVS in the board's storage partition. Steam's
# pairing over the cable stores the bond and then reboots the board: without these it is lost.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y

# Log and shell on the USB serial port in wireless mode ("opensc2 status", "opensc2 state"). The
# shell prints the log, so the plain UART log output is off (it would print every line twice).
# While wired the log goes into the USB session log, and the log thread needs a bigger stack.
CONFIG_LOG=y
CONFIG_LOG_PROCESS_THREAD_STACK_SIZE=1536
CONFIG_SHELL=y
CONFIG_LOG_BACKEND_UART=n
CONFIG_SHELL_PROMPT_UART="opensc2:~$ "
CONFIG_MAIN_STACK_SIZE=2048
