#
# On top of prj.conf: one actuator (an ERM or an LRA) on a DRV2605(L) breakout instead of the I2S
# amplifier and the PWM DAC. Every 8 ms the louder of the two paths' rendered blocks becomes the
# chip's real-time amplitude. Set the overlay's actuator-mode ("ERM" or "LRA") to yours.
#
#   powershell -NoProfile -ExecutionPolicy Bypass -File build.ps1 -Project samples\haptics\drv2605.conf -OutDir C:\b\osc2-drv -Pristine
CONFIG_OPENSC2_HAPTICS_OUT_I2S=n
CONFIG_OPENSC2_HAPTICS_OUT_PWM_DAC=n
CONFIG_OPENSC2_HAPTICS_OUT_DRV2605=y
