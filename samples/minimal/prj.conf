# The smallest OpenSC2 application: one button and a pairing button.

CONFIG_OPENSC2=y
CONFIG_GPIO=y

# The puck sends packets of up to 128 bytes; the real controller keeps two replies queued.
CONFIG_ESB_MAX_PAYLOAD_LENGTH=128
CONFIG_ESB_TX_FIFO_SIZE=2

# Bonds survive a reboot in Zephyr settings, on NVS in the board's storage partition.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y

# The SuperMini has no 32.768 kHz crystal: use the calibrated internal RC oscillator.
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC_CALIBRATION=y

# Log output on the board's USB serial port.
CONFIG_LOG=y

# Input sampling in main() runs below the radio thread (priority 5).
CONFIG_MAIN_THREAD_PRIORITY=7
