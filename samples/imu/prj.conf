# An MPU-6050 (or another sensor-API IMU) as the controller's IMU.
CONFIG_OPENSC2=y
CONFIG_OPENSC2_FUSION=y
CONFIG_ESB_MAX_PAYLOAD_LENGTH=128
CONFIG_ESB_TX_FIFO_SIZE=2

CONFIG_GPIO=y
CONFIG_INPUT=y
CONFIG_I2C=y
CONFIG_SENSOR=y
# Read on request; no interrupt line needed.
CONFIG_MPU6050_TRIGGER_NONE=y
CONFIG_FPU=y

CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y

CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC_CALIBRATION=y
CONFIG_LOG=y
CONFIG_MAIN_STACK_SIZE=2048

# Input sampling in main() runs below the radio thread (priority 5).
CONFIG_MAIN_THREAD_PRIORITY=7
