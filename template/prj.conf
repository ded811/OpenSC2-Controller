#
# The Kconfig of your controller, for any board. Lines for one board go in boards/<board>.conf
# (the SuperMini's: its clock), its pins in boards/<board>.overlay. Every OpenSC2 option is in
# docs/api.md of the OpenSC2-Controller repository (Kconfig options).

# ---- the library ------------------------------------------------------------------------------
# OpenSC2 itself. It selects the nRF Connect SDK's Enhanced ShockBurst, the puck's radio link.
CONFIG_OPENSC2=y
# The puck sends packets of up to 128 bytes (checked at build time); the real controller keeps two
# replies queued.
CONFIG_ESB_MAX_PAYLOAD_LENGTH=128
CONFIG_ESB_TX_FIFO_SIZE=2

# ---- inputs -----------------------------------------------------------------------------------
# The buttons are a gpio-keys node in the overlay, read through Zephyr's input subsystem.
CONFIG_GPIO=y
CONFIG_INPUT=y

# ---- wired mode: the board as a USB Steam Controller 2 (28DE:1302) ------------------------------
# On by itself when the overlay chooses the HID node (opensc2,usb-hid). The library runs the USB
# device, so the board's own serial port must not start at boot (checked at build time); in
# wireless mode the library shows the serial console instead.
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=n
# Eight input reports may wait for the PC at once, as on the real controller.
CONFIG_USBD_HID_IN_BUF_COUNT=8
# Vendor commands that write flash (Steam's bond) run in the USB stack's thread (checked at build
# time); the library's other wired-mode work runs in the system work queue.
CONFIG_USBD_THREAD_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# ---- storage: the bonds, the identity and the mode policy survive a reboot ----------------------
# Zephyr settings on NVS, in the board's storage partition. Steam pairs the board over the cable
# and then reboots it into wireless mode: without these lines the pairing is lost on the way (the
# build warns).
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y

# ---- log and shell ------------------------------------------------------------------------------
# In wireless mode both are on the USB serial port ("OpenSC2 console"): opensc2 status, opensc2
# bonds and the other opensc2 commands. While wired the log goes into the USB session log, written
# by the log thread, which then needs more than its default stack (checked at build time).
CONFIG_LOG=y
CONFIG_LOG_PROCESS_THREAD_STACK_SIZE=1536
CONFIG_SHELL=y
CONFIG_LOG_BACKEND_UART=n
CONFIG_SHELL_PROMPT_UART="opensc2:~$ "

# ---- main ---------------------------------------------------------------------------------------
# main() keeps running (it drives the status LED): give it room, and a priority below the
# library's radio and USB threads (5).
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_MAIN_THREAD_PRIORITY=7

# ---- identity (optional) ------------------------------------------------------------------------
# What Steam reads as the firmware revision: 1 to 12 characters, no spaces. The default is the
# library's release ("osc2-X.Y.Z").
#CONFIG_OPENSC2_GIT_REVISION="my-ctrl-1.0"

# ---- hardware test hooks (optional) -------------------------------------------------------------
# For OpenSC2's hardware test suite (tools/hwtest). The suite was written for and run against
# app/; with the hooks it may work with your firmware too, not tried. Inert until the suite arms
# them; leave them off in a board you give to someone else.
#CONFIG_OPENSC2_TEST_HOOKS=y
