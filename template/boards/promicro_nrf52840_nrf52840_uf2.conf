#
# SuperMini / Pro Micro nRF52840: no 32.768 kHz crystal, so the internal RC oscillator, calibrated.
# Zephyr reads this file after prj.conf when it builds for this board target; for another board,
# give it a file named after that board target (or none).
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC_CALIBRATION=y
