#
# The Partition Manager (the nRF Connect SDK's default for nRF chips) would ignore the board's flash
# partitions: the application would not land at the UF2 bootloader's application address, and the
# settings could end up inside the bootloader. Use the devicetree partitions.
SB_CONFIG_PARTITION_MANAGER=n
